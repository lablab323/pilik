plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.pilik.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.pilik.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
